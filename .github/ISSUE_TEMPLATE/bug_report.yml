name: Bug Report
description: Report a reproducible bug or unexpected failure
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please provide detailed diagnostic information to help reproduce and resolve the issue quickly.
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Clear and concise explanation of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands, code snippets, or inputs to trigger the behavior.
      placeholder: |
        1. Run '...'
        2. Execute '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Versions
      description: Operating system, compiler/runtime version, and architecture.
      placeholder: |
        - OS: macOS Sonoma 14.6 / Ubuntu 24.04
        - Architecture: arm64 / x86-64
        - Version: v1.0.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Stack Trace
      render: shell
